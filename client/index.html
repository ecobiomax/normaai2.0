<!doctype html>
<html lang="pt-BR">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>VibeDia — Mensagens Motivacionais e Horóscopo Diário</title>
    <meta name="description" content="Portal de mensagens inspiracionais, frases motivacionais e horóscopo diário para todos os signos. Conteúdo gerado por IA, atualizado diariamente." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#1A2744" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="VibeDia" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:type" content="website" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@VibeDia" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- RSS Feed -->
    <link rel="alternate" type="application/rss+xml" title="VibeDia — Mensagens e Horóscopo" href="/feed.xml" />

    <!-- Google Fonts: Playfair Display + Cormorant Garamond + Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- React Refresh Preamble (sync fallback for manus-runtime compatibility) -->
    <script>
      window.$RefreshReg$ = window.$RefreshReg$ || function() {};
      window.$RefreshSig$ = window.$RefreshSig$ || function() { return function(type) { return type; }; };
    </script>

    <!-- Schema.org WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "VibeDia",
      "url": "https://www.vibedia.com.br",
      "description": "Portal de mensagens motivacionais e horóscopo diário gerado por inteligência artificial",
      "inLanguage": "pt-BR",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://www.vibedia.com.br/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
